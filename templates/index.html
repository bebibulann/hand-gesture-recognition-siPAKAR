<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Hand Gesture Recognition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

<header class="bg-white border-b px-6 py-4 flex justify-between">
  <h1 class="text-xl font-bold">Hand Gesture Recognition by: siPakar</h1>
  <span class="text-green-600 text-sm">● Pengantar Kecerdasan Buatan</span>
</header>

<main class="flex-1 max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

  <!-- CAMERA -->
  <div class="lg:col-span-8 bg-black rounded-xl overflow-hidden relative">
    <img id="videoFeed" class="w-full h-full object-cover"/>
    <div id="overlay"
      class="absolute inset-0 flex items-center justify-center bg-black/70 text-gray-300">
      Camera inactive
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="lg:col-span-4 flex flex-col gap-4">

    <!-- RIGHT -->
    <div class="bg-white p-4 rounded-xl shadow">
      <h2 class="text-sm uppercase text-gray-500">Right Hand</h2>
      <h3 id="rightGesture" class="text-2xl font-bold">Waiting...</h3>
      <div class="mt-2">
        <div class="flex justify-between text-xs">
          <span>Confidence</span>
          <span id="rightConf">0%</span>
        </div>
        <div class="h-2 bg-gray-200 rounded">
          <div id="rightBar" class="h-2 bg-blue-600 rounded"></div>
        </div>
      </div>
    </div>

    <!-- LEFT -->
    <div class="bg-white p-4 rounded-xl shadow">
      <h2 class="text-sm uppercase text-gray-500">Left Hand</h2>
      <h3 id="leftGesture" class="text-2xl font-bold">Waiting...</h3>
      <div class="mt-2">
        <div class="flex justify-between text-xs">
          <span>Confidence</span>
          <span id="leftConf">0%</span>
        </div>
        <div class="h-2 bg-gray-200 rounded">
          <div id="leftBar" class="h-2 bg-green-600 rounded"></div>
        </div>
      </div>
    </div>

  </div>
</main>

<footer class="bg-white border-t p-4 flex gap-4">
  <button onclick="startCamera()" class="bg-blue-600 text-white px-4 py-2 rounded">
    Start
  </button>
  <button onclick="stopCamera()" class="border px-4 py-2 rounded">
    Stop
  </button>
</footer>

<script>
let interval = null;

function startCamera(){
  videoFeed.src = "/video";
  overlay.style.display = "none";
  fetch("/start");

  if(!interval){
    interval = setInterval(updateGesture, 500);
  }
}

function stopCamera(){
  videoFeed.src = "";
  overlay.style.display = "flex";
  fetch("/stop");
  clearInterval(interval);
  interval = null;
}

async function updateGesture(){
  const res = await fetch("/gesture");
  const data = await res.json();

  rightGesture.innerText = data.right_hand.gesture;
  rightConf.innerText = data.right_hand.confidence + "%";
  rightBar.style.width = data.right_hand.confidence + "%";

  leftGesture.innerText = data.left_hand.gesture;
  leftConf.innerText = data.left_hand.confidence + "%";
  leftBar.style.width = data.left_hand.confidence + "%";
}
</script>

</body>
</html>
